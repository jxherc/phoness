[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[lib]
# lib too, so examples/mac.rs can drive the same code from a mac
crate-type = ["staticlib", "lib"]

[dependencies]
# a copy of idevice at 26a28f6 (github.com/jkcoxson/idevice) with one patch:
# XCUITestService::run_rsd, so xctest can start over a remote pairing tunnel
idevice = { path = "idevice", default-features = false, features = [
  "ring",
  "tcp",
  "heartbeat",
  "installation_proxy",
  "mobile_image_mounter",
  "tss",
  "xctest",
  "remote_pairing",
  "rsd",
  "tunnel_tcp_stack",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
plist = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
