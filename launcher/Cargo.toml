[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
# pinned to the commit this was written against
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "26a28f6", default-features = false, features = [
  "ring",
  "tcp",
  "heartbeat",
  "installation_proxy",
  "mobile_image_mounter",
  "tss",
  "xctest",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
plist = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
