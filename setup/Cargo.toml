[package]
name = "pairing"
version = "0.1.0"
edition = "2024"

# runs on the mac once: writes a remote pairing file the phone uses to reach itself

[dependencies]
# same patched idevice copy the launcher uses
idevice = { path = "../launcher/idevice", default-features = false, features = [
  "ring",
  "usbmuxd",
  "syslog_relay",
  "tcp",
  "core_device_proxy",
  "remote_pairing",
  "rsd",
  "tunnel_tcp_stack",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
